[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bisafeaudit"
version = "0.1.0"
description = "Constraint-qualified auditor selection for visual dataset auditing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Avdhesh Mishra"},
  {name = "Venkata Siddharth Dhara"},
  {name = "Pawan Kumar"},
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/mishra-avdhesh/Rare-or-Wrong-BiSafeAudit"

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code/tests"]
